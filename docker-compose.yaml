services:
  flask:
    image: webapp-flask
    build:
      context: .
      dockerfile: app/Dockerfile.dev
    ports:
      - 5000:5000
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./:/app
    
