  db:
    image: postgres:16.3
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - ./instance:/var/lib/postgresql/data 
 
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8080:8080
 
