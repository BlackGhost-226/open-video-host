services:
  adminer:
    image: adminer:latest
    ports: 
      - 98:8080
  
  redis: 
    image: redis:7-alpine
    container_name: redis
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 15s
      retries: 3

  postgresql_db:
    image: postgres:16.3
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "test"]
      interval: 15s
      timeout: 15s
      retries: 3
  
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    #environment:
    #  RABBITMQ_DEFAULT_USER: test
    #  RABBITMQ_DEFAULT_PASS: test
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 15s
      retries: 3

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f http://minio:9001/minio/health/live || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 3
  
  mongo:
      image: mongo
      restart: always
      logging:
          options:
              max-size: 1g
      environment:
          - MONGO_INITDB_ROOT_USERNAME=mongoadmin
          - MONGO_INITDB_ROOT_PASSWORD=bdung
      volumes:
      - ./data/mongo/init:/docker-entrypoint-initdb.d
      - ./data/mongo/db:/data/db
      - ./data/mongo/configdb:/data/configdb
      - ./data/mongo/mongot:/data/mongot
      healthcheck:
        test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
        interval: 15s
        timeout: 15s
        retries: 3

  ui:
    image: ui
    build:
      context: .
      dockerfile: ./services/ui/Dockerfile.dev
    ports:
      - 80:80
    volumes:
      - ./services/ui:/app/app # hot-reload
    #depends_on:
    #  idp:
    #    condition: service_healthy
    
  data_gateway:
    image: data-gateway
    build:
      context: .
      dockerfile: services/data_gateway/Dockerfile
    environment:
      S3_URI: minio://minio:minio123@minio:9000/
      DATABASE_URI: postgresql://test:test@postgresql_db:5432/test
      VECTOR_URI: mongodb://mongoadmin:bdung@mongo:27017/?retryWrites=true&w=majority
      VECTOR_DB_NAME: test
    ports:
      - 3030:80
    depends_on:
      postgresql_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongo:
        condition: service_healthy
  
  worker:
    image: worker
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      RABBITMQ_URI: 
    depends_on:
      rabbitmq:
        condition: service_healthy
  
  idp:
    image: idp
    build:
      context: .
      dockerfile: ./services/IdP/Dockerfile.dev
    environment:
      DATABASE_URI: postgresql://test:test@postgresql_db:5432/test
    ports:
      - 5000:80
    volumes:
      - ./data/IdP-rsa:/app/app/rsa # key pair
      - ./services/IdP:/app/app # hot-reload
    depends_on:
      postgresql_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  registry:
    image: service_registry
    build:
      context: .
      dockerfile: ./services/service_registry/Dockerfile.dev
  
  worker_manager:
    image: worker_manager
    build:
      context: .
      dockerfile: ./services/worker_manager/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
