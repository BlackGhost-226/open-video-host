<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>{{ data_json['title'] }}</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
        <link rel="stylesheet" href="https://vjs.zencdn.net/8.0.4/video-js.css"/>
    </head>

    <body>
        <div class="topbar">
            <form action="/search" method="get">
                <input type="text" name="q" placeholder="Search...">
                <input type="submit" value="Search">
            </form>
        </div>
        <div class="sidebar">
            <a href="/">Home</a>
            <a href="/history">History</a>
            <a href="/upload">Upload</a>
        </div>
        <div class="main">
             <video
                id="video"
                class="video-js vjs-default-skin"
                controls
                preload="auto"
                width="640"
                height="360"
                poster="{{ thumbnail_url }}"
                data-setup='{}'>
                <source src="{{ dash_url }}" type="application/dash+xml">
                <source src="{{ hls_url }}" type="application/x-mpegURL">
            </video>

            <!-- Core Video.js -->
            <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>

            <!-- DASH and HLS plugins for Video.js -->
            <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-dash@latest/dist/videojs-dash.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/videojs-http-streaming@latest/dist/videojs-http-streaming.min.js"></script>

            <script>
                var player = videojs('video');
                console.log('Player initialized:', player);
            </script>

            <p>{{ data_json['title'] }}</p>
            <p>{{ data_json['date'] }}</p>
        </div>
    </body>
</html>
