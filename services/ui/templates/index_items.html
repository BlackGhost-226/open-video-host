{% for group in items|batch(3, fill_with=None) %}
    <div class="video3">
        {% for item in group %}
            {% if item is not none %}
                <div class="video">
                    <a href="/video?id={{ item.id }}">
                        <img src="/stream/{{ item.id }}/thumbnail.jpg" alt="cant load img">
                        <p>{{ item.title }}</p>
                        <p>{{ item.date }}</p>
                    </a>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endfor %}

{% if has_more %}
    <div hx-get="/load-feed?offset={{ offset }}"
         hx-trigger="revealed"
         hx-swap="outerHTML"
         class="loading-indicator">
        Loading more...
    </div>
{% endif %}
