{% extends "layout.html" %}
{% block content %}
    <video
        id="video"
        class="video-js vjs-default-skin"
        controls
        preload="auto"
        width="640"
        height="360"
        poster="/stream/{{ video_id }}/thumbnail.jpg"
        data-setup='{}'>
        <source src="/stream/{{ video_id }}/dash/manifest.mpd" type="application/dash+xml">
        <source src="/stream/{{ video_id }}/hls/playlist.m3u8" type="application/x-mpegURL">
    </video>

    <!-- Core Video.js -->
    <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>

    <!-- DASH and HLS plugins for Video.js -->
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-dash@latest/dist/videojs-dash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-http-streaming@latest/dist/videojs-http-streaming.min.js"></script>

    <script>
        var player = videojs('video');
        console.log('Player initialized:', player);
    </script>
{% endblock content %}
